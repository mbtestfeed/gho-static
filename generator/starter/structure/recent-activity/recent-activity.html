<ul class="recent-links">
{{- range .Site.RecentActivity}}
    <li>
        <a href="{{$.Root}}{{.Link}}">{{.Title}}</a>
        <div class="recent-collection">{{.Collection}}</div>
        {{- with .Published}}
        <div class="recent-date">{{.}}</div>
        {{- end}}
    </li>
{{- end}}
</ul>
