# What the theme looks like, shown in the themes showcase.
summary: A slightly more modern look (at the time of writing), like you might see on a company's site, with cards, soft shadows and an indigo accent.
# Colours (for light and dark mode) and font, filled into this theme's CSS.
banner_color: # header, footer and menu background
    light: '#ffffff'
    dark: '#0f172a'
banner_text_color: # text and links in the header, footer and menu
    light: '#0f172a'
    dark: '#f1f5f9'
background_color:
    light: '#f8fafc'
    dark: '#020617'
text_color:
    light: '#1e293b'
    dark: '#e2e8f0'
link: # also the start of the accent gradient
    light: '#4f46e5'
    dark: '#818cf8'
link_clicked: # also the end of the accent gradient
    light: '#7c3aed'
    dark: '#a78bfa'
tag_color: # tag pill background
    light: '#eef2ff'
    dark: '#1e1b4b'
tag_text_color: # tag pill text
    light: '#4338ca'
    dark: '#c7d2fe'
font: 'Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
