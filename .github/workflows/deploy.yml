name: Deploy site

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      # Use this checkout's themes, rather than fetching them from GitHub.
      GHO_STATIC_LOCAL_THEMES: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A failing test fails this step, so the deploy steps below are skipped.
      - name: Run tests
        run: go test -json ./... > test-results.json

      - name: Report test results
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: Go tests
          path: test-results.json
          reporter: golang-json

      # Deploy key with write access to mbtestfeed/mbtestfeed.github.io.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Built once, so both deploys have the same build version.
      - name: Build site
        run: |
          go run main.go --generate --yes --quiet ../site
          go run main.go --publish --publish-with-themes --quiet ../site

      - name: Deploy to GitHub Pages
        run: go run main.go --deploy --no-rebuild --yes --quiet --deployment-method github-pages --deploy-setting username=mbtestfeed ../site

      - name: Deploy to Cloudflare Pages
        env:
          GHO_STATIC_CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: go run main.go --deploy --no-rebuild --yes --quiet --deployment-method cloudflare-pages --deploy-setting account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }} --deploy-setting project=gho-static --deploy-setting domain=gho-static.com ../site
