name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A failing test fails this step, so nothing is published.
      - name: Run tests
        run: go test ./...

      # Named gho-static-<os>-<arch>, as the README's install steps expect.
      # Pure Go, so every platform is cross-compiled here.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/gho-static-$os-$arch$ext" .
          done
          cd dist && sha256sum gho-static-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
